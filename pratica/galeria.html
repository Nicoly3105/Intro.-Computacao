    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Galeria de Mídias</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
    <h1>Galeria de Mídias</h1>
    </header>
    <div class="galeria">
        <div class="imagens">
            <figure>
                <img class="img1" src="./img/ninhonacaixa.jpeg" alt="Meu gordinho em cima da caixinha">
                <figcaption ><strong>Meu gordinho em cima da caixinha</strong></figcaption>
            </figure>

            <figure>
                <img class="img2" src="./img/ninhodeitado.jpeg" alt="Meu gordinho deitado">
                <figcaption ><strong>Meu gordinho lindo deitado</strong></figcaption>
            </figure>

            <figure>
                <img class="img3" src="./img//ninhonacaixinhadesapato.jpeg" alt="Meu gordinho estourando a caixa de sapato">
                <figcaption ><strong>Meu gordinho estourando a caixa de sapato</strong></figcaption>
            </figure>
        </div>

        <div class="videos">
            <figure>
                <video class="vid1" controls>
                    <source  src="./img/ninhoamassandopao.mp4" type="video/mp4">
                </video>
                <figcaption ><strong>Ninho amassando pãozinho</strong></figcaption>
            </figure>

            <figure>
                <video class="vid2" controls>
                    <source  src="./img/ninhobocejando.mp4" type="video/mp4">
                </video>
                <figcaption ><strong>Ninho charmoso bocejando</strong></figcaption>
            </figure>

            <figure>
                <video class="vid3" controls>
                    <source  src="./img/finadoninho.mp4" type="video/mp4">
                </video>
                <figcaption ><strong>Ninho dormindo profundamente</strong></figcaption>
            </figure>
        </div>

        <div class="audios">
            <figure>
                <audio class="aud1" controls>
                    <source src="./img/dansagatinho.mpeg" type="audio/mpeg">
                </audio>    
                <figcaption ><strong>Música dedicada ao meu gostosão, escuta baixo prof</strong></figcaption>
            </figure>

            <figure>
                <audio class="aud2" controls>
                    <source src="./img/musicaromantica (2).mpeg" type="audio/mpeg">
                </audio>
                <figcaption ><strong>Música altamente romântica pra combinar com o charme do meu gatão</strong></figcaption>
            </figure>
        </div>
    </div>
</body>
</html>
