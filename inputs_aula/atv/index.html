<!DOCTYPE html>
<html lang="pt - BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <form class="dados">
        <h1>Faça seu cadastro</h1>
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required>
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Digite seu email" required>
        <label for="senha">Senha</label>
        <input type="text" name="senha" id="senha" placeholder="Digite sua senha" required>
        <label for="Selecione uma opção">Camisa</label>
        <select name="camisa" id="camisa">
            <option value="">P</option>
            <option value="">M</option>
            <option value="">GG</option>
        </select>
        <label for="colorida">Colorida?</label>
        <input type="checkbox" name="colorida" id="colorida">
    </form>
</body>
</html>
